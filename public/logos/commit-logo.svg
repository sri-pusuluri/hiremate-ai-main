<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="commitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="commitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Base Container -->
  <rect width="200" height="200" rx="44" fill="url(#commitGrad)" filter="url(#commitGlow)"/>
  
  <!-- Git Commit Branch Lines -->
  <line x1="42" y1="100" x2="75" y2="100" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <line x1="125" y1="100" x2="158" y2="100" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <line x1="100" y1="42" x2="100" y2="75" stroke="white" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Commit Node Ring -->
  <circle cx="100" cy="100" r="28" stroke="white" stroke-width="12" fill="none"/>
  <circle cx="100" cy="100" r="14" fill="#93c5fd"/>
</svg>
