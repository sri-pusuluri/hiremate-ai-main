2. The Core Customization Features
A. Rules (.agents/rules/*.md or AGENTS.md)
Best for: Enforcing coding styles, architecture choices, library bans, or repository conventions.

How it works: Whenever the agent plans or writes code, it checks these rules and follows them automatically.
Format: Standard Markdown files.
Practical Example: .agents/rules/coding-guidelines.md
markdown
# Repository Coding Standards
## 1. Supabase Database Rules
- Never use direct SQL queries in client-facing components; use the typed Supabase client in `@/integrations/supabase/client`.
- Always check for expired jobs using `expires_at > new Date().toISOString()`.
## 2. React & TypeScript
- Use functional components with typed props interface.
- Use Tailwind CSS with pre-configured color tokens (`bg-primary`, `bg-muted`). Do not hardcode random hex codes.
(Note: You can also place an AGENTS.md or GEMINI.md file directly in any folder; the agent will apply it to that directory and all its children).

B. Skills (.agents/skills/<skill-name>/SKILL.md)
Best for: Teaching the agent multi-step procedures, runbooks, deployments, or testing workflows.

How it works (Progressive Disclosure): To avoid cluttering the agent's memory, only the name and description are kept in memory. The full SKILL.md body is only loaded into the conversation when you ask for that specific task.
Structure: Must contain a SKILL.md with YAML frontmatter at the top.
Practical Example: .agents/skills/deploy-supabase-function/SKILL.md
markdown
---
name: deploy-supabase-function
description: Use this skill when the user wants to build, test, or deploy a Supabase Edge Function to production.
---
# Supabase Edge Function Deployment Runbook
## Procedure:
1. Verify local environment variables in `.env`.
2. Run unit tests on the function:
   `npm run test:edge`
3. Deploy the function using Supabase CLI:
   `npx supabase functions deploy <function-name> --no-verify-jwt`
4. Confirm successful deployment by pinging the healthcheck endpoint.
C. MCP Tool Servers (.agents/mcp_config.json)
Best for: Connecting the agent directly to external tools, databases, or third-party APIs using the Model Context Protocol (MCP).

How it works: Grants the agent custom tools (e.g., querying your local database, reading GitHub PRs, or inspecting Docker containers).
Example: .agents/mcp_config.json
json
{
  "mcpServers": {
    "github": {
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-github"],
      "env": {
        "GITHUB_PERSONAL_ACCESS_TOKEN": "ghp_xxxxxxxxxxxx"
      }
    },
    "postgres": {
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-postgres", "postgresql://user:pass@localhost:5432/hiremate"]
    }
  }
}
D. Lifecycle Hooks (.agents/hooks.json)
Best for: Automatically running shell commands during agent lifecycle events (e.g., automatically formatting code after edits, or validating tests before committing).

Example: .agents/hooks.json
json
{
  "hooks": {
    "post_tool_execute": [
      {
        "matcher": "replace_file_content|write_to_file",
        "command": "npx prettier --write $TARGET_FILE"
      }
    ]
  }
}
3. How Antigravity Discovers and Prioritizes Customizations
When multiple rules or skills exist, Antigravity loads them in this priority order (highest to lowest):

Project Customizations (.agents/ in current repo) — Highest priority (overrides everything else).
Directory Rules (AGENTS.md / GEMINI.md in subfolders).
Global Config (~/.gemini/config/) — Across all projects on your Mac.
Built-in System Capabilities.
4. Quick Summary: Which One Should You Use?
What You Want to Do	Where to Put It
Tell the agent: "Always use our Supabase client and our embed plugins"	.agents/rules/your-rule.md
Teach the agent a step-by-step workflow: "How to run candidate AI batch evaluations"	.agents/skills/ai-eval/SKILL.md
Give the agent access to a local Postgres database or GitHub API	.agents/mcp_config.json
Automatically format files or run linter every time the agent edits code	.agents/hooks.json
Whenever you add or update files in .agents/, Antigravity detects them immediately—no restart or re-indexing needed.


