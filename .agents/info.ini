.agents/
├── rules/                    # 1. Permanent behavioral guidelines & architectural rules
│   ├── client-embed.md
│   └── code-style.md
├── skills/                   # 2. On-demand procedural workflows & runbooks
│   └── run-db-migration/
│       ├── SKILL.md          # Main instruction file with YAML frontmatter
│       ├── scripts/          # Executable helper scripts
│       └── references/       # Extra documentation read only when needed
├── plugins/                  # 3. Bundles combining skills, rules, hooks & MCP
│   └── hiresort-devkit/
│       ├── plugin.json
│       └── ...
├── mcp_config.json           # 4. External MCP tool servers (Postgres, GitHub, etc.)
